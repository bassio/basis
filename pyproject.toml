[project]
name = "basis-framework"
version = "0.1.1"
description = "A full-stack python reactive web components framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.127.0",
    "jinja2>=3.1.5",
    "typer>=0.20.0",
    "rich>=13.0.0",
]

[project.scripts]
basis = "basis.cli.main:app"

# Official in-tree plugins, registered through the same entry-point mechanism
# third-party plugins use ("everything is a plugin").
# NOTE: point at the submodule explicitly (``...regions.plugin:plugin``) — the
# package also imports a submodule named ``plugin``, which would shadow the
# instance attribute if resolved as ``...regions:plugin``.
[project.entry-points."basis.plugins"]
regions = "basis.plugins.regions.plugin:plugin"
ui = "basis.plugins.ui.plugin:plugin"
shell = "basis.plugins.shell.plugin:plugin"

[project.optional-dependencies]
db = [
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "notebook>=7.5.1",
    "fastapi[standard]>=0.127.0",
    "uvicorn>=0.40.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basis"]
