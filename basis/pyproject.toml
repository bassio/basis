[project]
name = "basis"
version = "0.1.0"
description = "A full-stack python reactive web components framework"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.127.0",
]

[project.optional-dependencies]
db = [
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "notebook>=7.5.1",
]
